name: Check sites

on:
  schedule:
    - cron: "7 5 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hvittingfoss Grøtterud, Sundvollen, Drammen Solbergåsen
      - run: npm run check -- 9616 9654 9585
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
