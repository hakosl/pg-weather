<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PG Weather</title>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <h1 class="brand">PG Weather</h1>
        <nav class="screens" id="screens" aria-label="Screen">
          <button type="button" class="chip" data-screen="favorites">Favorites</button>
          <button type="button" class="chip" data-screen="map">Map</button>
        </nav>
        <nav class="days" id="days" aria-label="Day"></nav>
        <div class="time">
          <button id="whole-day" class="chip" type="button" aria-pressed="true">Whole day</button>
          <input id="hour" type="range" min="6" max="21" step="1" value="13" aria-label="Hour" />
          <output id="hour-label" for="hour"></output>
        </div>
        <label class="model" for="model">Model <select id="model"></select></label>
      </header>
      <main class="stage">
        <div id="map" aria-label="Map of launch sites"></div>
        <section id="favorites" class="favorites" aria-label="Favorites" hidden></section>
        <div id="status" class="status" role="status" hidden></div>
        <details class="legend" id="legend"></details>
        <aside id="detail" class="detail" aria-live="polite" hidden></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
